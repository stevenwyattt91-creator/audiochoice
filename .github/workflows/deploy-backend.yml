name: Deploy AudioChoice backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'deploy/azure/**'
      - '.github/workflows/deploy-backend.yml'

permissions:
  contents: read

env:
  LOCATION: eastus
  ENVIRONMENT_NAME: staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Provision staging foundation
        shell: bash
        run: |
          az deployment group create \
            --name bootstrap \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --template-file deploy/azure/bootstrap.bicep \
            --parameters deploy/azure/bootstrap.parameters.json \
            --parameters location="$LOCATION" environmentName="$ENVIRONMENT_NAME"

      - name: Read foundation outputs
        id: foundation
        shell: bash
        run: |
          outputs=$(az deployment group show \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --name bootstrap \
            --query properties.outputs -o json 2>/dev/null || echo '{}')
          registry=$(az resource list --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" --resource-type Microsoft.ContainerRegistry/registries --query '[0].name' -o tsv)
          vault=$(az resource list --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" --resource-type Microsoft.KeyVault/vaults --query '[0].name' -o tsv)
          echo "registry=$registry" >> "$GITHUB_OUTPUT"
          echo "vault=$vault" >> "$GITHUB_OUTPUT"

      - name: Create staging database
        id: database
        shell: bash
        env:
          DB_PASSWORD: ${{ secrets.AZURE_STAGING_DATABASE_PASSWORD }}
        run: |
          if [ -z "$DB_PASSWORD" ]; then
            echo "AZURE_STAGING_DATABASE_PASSWORD must be added before deployment." >&2
            exit 1
          fi
          az deployment group create \
            --name database \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --template-file deploy/azure/database.bicep \
            --parameters location=westus3 administratorPassword="$DB_PASSWORD"
          host=$(az deployment group show \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --name database \
            --query properties.outputs.serverHostname.value -o tsv)
          echo "host=$host" >> "$GITHUB_OUTPUT"

      - name: Build backend image in Azure Container Registry
        shell: bash
        run: |
          az acr build \
            --registry "${{ steps.foundation.outputs.registry }}" \
            --image "audiochoice-api:${GITHUB_SHA}" \
            --file backend/Dockerfile .

      - name: Create runtime secrets in Key Vault
        id: secrets
        shell: bash
        env:
          DB_PASSWORD: ${{ secrets.AZURE_STAGING_DATABASE_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          token=$(openssl rand -hex 32)
          connection="Host=${{ steps.database.outputs.host }};Port=5432;Database=audiochoice;Username=audiochoice_admin;Password=$DB_PASSWORD;SSL Mode=Require"
          az keyvault secret set --vault-name "${{ steps.foundation.outputs.vault }}" --name staging-api-token --value "$token" >/dev/null
          az keyvault secret set --vault-name "${{ steps.foundation.outputs.vault }}" --name postgres-connection-string --value "$connection" >/dev/null
          echo "API_TOKEN=$token" >> "$GITHUB_ENV"

          # The premium voice is optional. A deployment must never reference a Key Vault secret
          # that is absent -- that fails the whole revision and takes the working API down with it --
          # so whether the credentials exist is decided here and passed on, rather than assumed.
          # Without them the API still deploys and still scans text; only the paid voice is withheld.
          if [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ]; then
            az keyvault secret set --vault-name "${{ steps.foundation.outputs.vault }}" \
              --name aws-access-key-id --value "$AWS_ACCESS_KEY_ID" >/dev/null
            az keyvault secret set --vault-name "${{ steps.foundation.outputs.vault }}" \
              --name aws-secret-access-key --value "$AWS_SECRET_ACCESS_KEY" >/dev/null
            echo "aws=true" >> "$GITHUB_OUTPUT"
            echo "Premium voice credentials found; synthesis will be enabled."
          else
            echo "aws=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY are not set, so the premium voice stays off. Text scanning is unaffected."
          fi

          # Written from the repository secret when one is set, so rotating the sending key is a
          # change in one place rather than a manual vault edit. Set unconditionally when present,
          # because a rotated key must replace the stored one rather than be ignored because
          # something is already there.
          if [ -n "$RESEND_API_KEY" ]; then
            az keyvault secret set --vault-name "${{ steps.foundation.outputs.vault }}" \
              --name resend-api-key --value "$RESEND_API_KEY" >/dev/null
            echo "Stored the transactional email key from repository secrets."
          fi

          # Transactional email needs a key to send with. Asked rather than assumed, for the same
          # reason as the AWS credentials: referencing a Key Vault secret that is absent fails the
          # whole revision and would take the working API down. Without it email stays off, which
          # keeps the password reset endpoint from accepting requests it cannot act on.
          if az keyvault secret show --vault-name "${{ steps.foundation.outputs.vault }}" \
              --name resend-api-key >/dev/null 2>&1; then
            echo "resend=true" >> "$GITHUB_OUTPUT"
            echo "Transactional email key found; password reset email will be sent."
          else
            echo "resend=false" >> "$GITHUB_OUTPUT"
            echo "::warning::resend-api-key is not in Key Vault, so transactional email stays off and password reset cannot send. Add it to enable account recovery."
          fi

      - name: Deploy API container
        shell: bash
        run: |
          az deployment group create \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --template-file deploy/azure/api.bicep \
            --parameters location="$LOCATION" imageTag="$GITHUB_SHA" narrationAwsCredentialsPresent=${{ steps.secrets.outputs.aws }} resendApiKeyPresent=${{ steps.secrets.outputs.resend }} googleClientID='105248861745-34kh2v9g9825kb1drs3jrgmijjum2p3o.apps.googleusercontent.com,105248861745-hikuiqttbh10okeksf972rk5osdf4d0c.apps.googleusercontent.com' appleClientID='com.audiochoice.website,com.audiochoice.mobile'

      - name: Report narration configuration
        shell: bash
        run: |
          echo "Text scanning: enabled"
          if [ "${{ steps.secrets.outputs.aws }}" = "true" ]; then
            echo "Premium voice: enabled"
          else
            echo "Premium voice: disabled (no AWS credentials in repository secrets)"
          fi
          if [ "${{ steps.secrets.outputs.resend }}" = "true" ]; then
            echo "Password reset email: enabled"
          else
            echo "Password reset email: DISABLED (resend-api-key missing from Key Vault)"
          fi

      - name: Show API endpoint
        shell: bash
        run: |
          az containerapp show \
            --name audiochoice-stg-api \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --query properties.configuration.ingress.fqdn -o tsv
