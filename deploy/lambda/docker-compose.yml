services:
  whisper:
    image: audiochoice-whisper:local
    build:
      context: ../..
      dockerfile: deploy/lambda/Dockerfile.whisper
    restart: unless-stopped
    network_mode: host
    volumes:
      # Persist the model between nightly replacement instances.
      - /lambda/nfs/audiochoice-worker-state/huggingface-cache:/root/.cache/huggingface
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3-turbo}
      WHISPER_FALLBACK_MODEL: ${WHISPER_FALLBACK_MODEL:-large-v3}
      WHISPER_DEVICE: cuda
      WHISPER_COMPUTE_TYPE: float16
      WHISPER_WORKERS: ${WHISPER_WORKERS:-1}
      WHISPER_CONCURRENCY_PER_WORKER: ${WHISPER_CONCURRENCY_PER_WORKER:-2}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  scanner:
    image: audiochoice-scanner:local
    build:
      context: ../..
      dockerfile: deploy/lambda/Dockerfile
    restart: unless-stopped
    network_mode: host
    env_file:
      - lambda-worker.env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      AudioChoice__OpenAI__WorkerEnabled: "true"
      AudioChoice__OpenAI__ProcessingLane: ios-beta-lambda
      # Transcripts MUST go to shared Blob storage, not this container's disk.
      # Nothing mounts a volume for the scanner and these instances are replaced
      # nightly, so a file-backed transcript is destroyed within a day -- while the
      # scan result survives in PostgreSQL. That combination is exactly what makes a
      # book show working filters and yet report no read-along timing data.
      # Requires BlobEnabled and StorageAccountName in lambda-worker.env; the
      # scanner refuses to start otherwise rather than writing somewhere temporary.
      AudioChoice__TemporaryAudioStorage__BlobTranscriptEnabled: "true"
      AudioChoice__OpenAI__TranscriptionProvider: faster-whisper
      # Classification transport. Left on OpenAI until Nova has been compared against saved
      # results on books whose correct answer is already known. Switching is these four lines
      # plus AWS credentials in lambda-worker.env; nothing else changes, because the scanner's
      # judgement does not live in the transport.
      #
      # Bump ScannerVersion at the same time. Results are stored per edition and scanner
      # version, so a new version writes new rows instead of overwriting the OpenAI ones,
      # which is what makes the two comparable rather than one destroying the other.
      #
      # AudioChoice__OpenAI__AnalysisProvider: bedrock
      # AudioChoice__OpenAI__BedrockRegion: us-east-1
      # AudioChoice__OpenAI__AnalysisModel: amazon.nova-lite-v1:0
      # AudioChoice__OpenAI__SceneVerificationModel: amazon.nova-pro-v1:0
      # AudioChoice__OpenAI__SceneEscalationModel: amazon.nova-pro-v1:0
      # AudioChoice__OpenAI__ScannerVersion: "4.0-nova"
      AudioChoice__OpenAI__FasterWhisperEndpoint: http://127.0.0.1:8001/
      # A single GPU chunk may take several minutes under load. The scanner now
      # applies this explicitly and no longer uses HttpClient's 100-second default.
      AudioChoice__OpenAI__FasterWhisperTimeoutSeconds: "900"
      AudioChoice__OpenAI__ScanWorkerConcurrency: "2"
      # Two end-to-end lanes share two total GPU transcription slots. Avoid
      # creating a deep per-lane HTTP backlog behind the Whisper semaphore.
      AudioChoice__OpenAI__TranscriptionWorkers: "1"
      AudioChoice__OpenAI__TranscriptionConcurrencyPerWorker: "1"
      # Bounded parallel model work: independent transcript windows can run together,
      # while Terra remains the gate before any Sol escalation.
      AudioChoice__OpenAI__ContentAnalysisConcurrency: "2"
      AudioChoice__OpenAI__SceneVerificationConcurrency: "2"
      AudioChoice__OpenAI__SceneEscalationConcurrency: "2"
      # Review every transcript window so euphemistic sexual cues are not
      # excluded before Terra/Sol receive them.
      # Keep Whisper local, then send only high-recall candidate windows to OpenAI.
      # Sexual candidates from that pass continue through Terra and Sol.
      AudioChoice__OpenAI__LocalCandidateFunnelEnabled: "false"
      # Scan every transcript segment locally in Lambda first. Only high-recall
      # sexual-content windows proceed to Terra, then qualifying scenes to Sol.
      # Use the semantic analysis path so every event receives a contextual,
      # non-explicit description like the established app screenshots. Sexual
      # candidates still pass through Terra and then Sol; mild/intense/death
      # violence remains excluded by the scanner policy.
      AudioChoice__OpenAI__LambdaFirstPassEnabled: "false"
      AudioChoice__OpenAI__MaximumSceneVerificationRequestsPerJob: "300"
      AudioChoice__OpenAI__MaximumSceneEscalationRequestsPerJob: "300"
      # Apply new schema migrations (including chunk progress/title backfill)
      # before the scanner begins claiming jobs.
      AudioChoice__Database__ApplyMigrations: "true"
