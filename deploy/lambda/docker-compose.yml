services:
  qwen:
    image: vllm/vllm-openai:v0.29.0-cu129
    restart: unless-stopped
    network_mode: host
    ipc: host
    volumes:
      # Reuses the same cache whisper already persists to, so the ~15GB quantized model
      # survives nightly instance replacement instead of re-downloading.
      - /lambda/nfs/audiochoice-worker-state/huggingface-cache:/root/.cache/huggingface
    environment:
      # Only needed if the chosen model repo is gated on Hugging Face; leave unset otherwise.
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    # Same model, same settings this session's eval sidecar (deploy/lambda/vllm-eval)
    # validated against a 35-case ground-truth set (scripts/eval/ground_truth_scenes.json)
    # spanning sexual content, graphic violence, and self-harm across 12+ real books --
    # 31/33 scored cases passed, the only 2 misses being the two hardest, most
    # consent-ambiguous passages this session ever found, which OpenAI's own production
    # pipeline also could not reliably agree with itself on across 29+ independent calls.
    #
    # GPU budget: this host's single A100 40GB also runs the whisper transcription
    # container (idle ~2.5GB, headroom under load). --gpu-memory-utilization 0.70 caps this
    # service at roughly 28GB. Measured directly on this host: AWQ INT4 weight loading
    # alone takes just under 20GB, so anything below ~0.55 leaves no room for a KV cache at
    # all and the engine refuses to start ("No available memory for the cache blocks").
    #
    # --max-model-len 65536, not 32768: a real production Luna first-pass batch (Content
    # AnalysisModel, up to MaximumSegmentsPerAnalysisRequest=100 transcript segments) hit
    # 24,769 input tokens on the very first live scan through this pipeline, and combined
    # with VllmMaxTokens' output budget (8000) exceeded 32768 outright -- the job failed
    # loudly with "This model's maximum context length is 32768 tokens... your prompt
    # contains at least 24769 input tokens". 32768 was sized against this session's own
    # eval excerpts (a few dozen transcript segments each), never against a real full-size
    # production batch. Doubled here with real margin instead of tuned to the exact
    # observed failure, since a longer chapter or a denser batch could need more still.
    #
    # --max-num-seqs 8: Qwen3.6 is a hybrid Mamba/attention (GDN) model -- every concurrent
    # decode sequence needs its own Mamba cache block, separate from the regular KV cache.
    # Measured directly on this host at gpu-memory-utilization=0.70 and --max-model-len 32768:
    # only 94 Mamba cache blocks were available, well under vLLM's default max_num_seqs of
    # 256, which made the engine refuse to start outright ("No available memory for the
    # cache blocks"). Lowered further from this session's own eval sidecar value (32) to make
    # room for the doubled --max-model-len below: production's real concurrency ceiling is
    # ContentAnalysisConcurrency (2) + SceneVerificationConcurrency (2) +
    # SceneEscalationConcurrency (2) = 6 at most, so 8 has real margin without over-claiming
    # KV cache the longer context needs. Raise only after confirming the real available-block
    # count logged at startup, and only if actual concurrent load approaches this ceiling.
    #
    # Served model name matches RoutingAnalysisModelClient.IsVllmModel's check (contains
    # "qwen") and the three AudioChoice__OpenAI__*Model values below -- all three must agree
    # for a tier's model name to resolve to this service rather than failing loudly.
    command: >
      --model QuantTrio/Qwen3.6-27B-AWQ
      --quantization awq
      --port 8002
      --max-model-len 65536
      --gpu-memory-utilization 0.70
      --max-num-seqs 8
      --served-model-name qwen3.6-27b
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  whisper:
    image: audiochoice-whisper:local
    build:
      context: ../..
      dockerfile: deploy/lambda/Dockerfile.whisper
    restart: unless-stopped
    network_mode: host
    volumes:
      # Persist the model between nightly replacement instances.
      - /lambda/nfs/audiochoice-worker-state/huggingface-cache:/root/.cache/huggingface
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3-turbo}
      WHISPER_FALLBACK_MODEL: ${WHISPER_FALLBACK_MODEL:-large-v3}
      WHISPER_DEVICE: cuda
      WHISPER_COMPUTE_TYPE: float16
      WHISPER_WORKERS: ${WHISPER_WORKERS:-1}
      # Raised from 2. This A100 is dedicated to this workload alone (no shared TTS
      # synthesis load -- see SynthesisRouter's endpoint-collision guard), and
      # large-v3-turbo's VRAM footprint leaves headroom for more than two chunks
      # in flight. Four is a safer starting ceiling, not a measured maximum: watch
      # for "transcription_slot_saturated" log lines (queue wait time staying above
      # WHISPER_SATURATION_WARNING_SECONDS) to tell whether to raise it further, and
      # watch GPU memory/utilization under real load before raising it again.
      WHISPER_CONCURRENCY_PER_WORKER: ${WHISPER_CONCURRENCY_PER_WORKER:-4}
      WHISPER_SATURATION_WARNING_SECONDS: ${WHISPER_SATURATION_WARNING_SECONDS:-5}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  scanner:
    image: audiochoice-scanner:local
    build:
      context: ../..
      dockerfile: deploy/lambda/Dockerfile
    restart: unless-stopped
    network_mode: host
    volumes:
      # Luna/Terra/Sol checkpoint one completed analysis batch at a time specifically so a
      # mid-scan failure -- OpenAI credits running out, a timeout, this container being
      # replaced -- does not have to re-pay for work already done. Without this mount that
      # checkpoint directory lived on the container's own filesystem instead, which nightly
      # instance replacement (and every `--force-recreate` during a deploy) destroys, so the
      # code's own recovery path had nothing durable to recover from.
      - /lambda/nfs/audiochoice-worker-state/scanner-data:/data
    env_file:
      - lambda-worker.env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      AudioChoice__DataPath: /data
      AudioChoice__OpenAI__WorkerEnabled: "true"
      AudioChoice__OpenAI__ProcessingLane: ios-beta-lambda
      # Transcripts MUST go to shared Blob storage, not this container's disk.
      # Nothing mounts a volume for the scanner and these instances are replaced
      # nightly, so a file-backed transcript is destroyed within a day -- while the
      # scan result survives in PostgreSQL. That combination is exactly what makes a
      # book show working filters and yet report no read-along timing data.
      # Requires BlobEnabled and StorageAccountName in lambda-worker.env; the
      # scanner refuses to start otherwise rather than writing somewhere temporary.
      AudioChoice__TemporaryAudioStorage__BlobTranscriptEnabled: "true"
      AudioChoice__OpenAI__TranscriptionProvider: faster-whisper
      # Classification transport. Switched to a fully self-hosted vLLM model (Qwen3.6-27B,
      # served by the qwen service above) for every tier -- no OpenAI credits required for
      # analysis at all. Validated first against a 35-case ground-truth eval set spanning
      # sexual content, graphic violence, and self-harm (scripts/eval/ground_truth_scenes.json,
      # 31/33 scored cases passed) before being switched on here.
      #
      # Rollback path, if this does not hold up in production: change AnalysisProvider back
      # to the OpenAI default (delete or comment this whole block) and bump ScannerVersion
      # again. Nothing else needs to change -- OpenAIResponsesModelClient and every OpenAI
      # config value are untouched, not removed, specifically so this is a config edit and a
      # redeploy, never a code change or a rebuild of removed functionality.
      #
      # ScannerVersion is bumped in OpenAIProcessingOptions.cs's own default
      # (6.1-vllm-qwen-prompt-fixes) rather than repeated here, so a result written under the
      # prior OpenAI-backed version -- or under an earlier vLLM prompt revision -- is never
      # presented as though the current version had produced it.
      AudioChoice__OpenAI__AnalysisProvider: vllm
      AudioChoice__OpenAI__VllmEndpoint: http://127.0.0.1:8002/v1/
      AudioChoice__OpenAI__AnalysisModel: qwen3.6-27b
      AudioChoice__OpenAI__SceneVerificationModel: qwen3.6-27b
      AudioChoice__OpenAI__SceneEscalationModel: qwen3.6-27b
      #
      # Bedrock/Nova path, kept for reference, not in use:
      # AudioChoice__OpenAI__AnalysisProvider: bedrock
      # AudioChoice__OpenAI__BedrockRegion: us-east-1
      # AudioChoice__OpenAI__AnalysisModel: amazon.nova-lite-v1:0
      # AudioChoice__OpenAI__SceneVerificationModel: amazon.nova-pro-v1:0
      # AudioChoice__OpenAI__SceneEscalationModel: amazon.nova-pro-v1:0
      # AudioChoice__OpenAI__ScannerVersion: "4.0-nova"
      AudioChoice__OpenAI__FasterWhisperEndpoint: http://127.0.0.1:8001/
      # A single GPU chunk may take several minutes under load. The scanner now
      # applies this explicitly and no longer uses HttpClient's 100-second default.
      AudioChoice__OpenAI__FasterWhisperTimeoutSeconds: "900"
      AudioChoice__OpenAI__ScanWorkerConcurrency: "2"
      # Must match whisper's own WHISPER_WORKERS * WHISPER_CONCURRENCY_PER_WORKER
      # above. This used to be 1x1, which serialized every transcription request
      # behind a single semaphore slot even though the GPU server itself already
      # had open slots -- so a second scan lane's job sat idle waiting on this
      # side while the GPU sat idle on the other. Kept at four in step with the
      # GPU's own ceiling above; raise both together, never just one.
      AudioChoice__OpenAI__TranscriptionWorkers: "1"
      AudioChoice__OpenAI__TranscriptionConcurrencyPerWorker: "4"
      # Bounded parallel model work: independent transcript windows can run together,
      # while Terra remains the gate before any Sol escalation.
      AudioChoice__OpenAI__ContentAnalysisConcurrency: "2"
      AudioChoice__OpenAI__SceneVerificationConcurrency: "2"
      AudioChoice__OpenAI__SceneEscalationConcurrency: "2"
      # Review every transcript window so euphemistic sexual cues are not
      # excluded before Terra/Sol receive them.
      # Keep Whisper local, then send only high-recall candidate windows to OpenAI.
      # Sexual candidates from that pass continue through Terra and Sol.
      AudioChoice__OpenAI__LocalCandidateFunnelEnabled: "false"
      # Scan every transcript segment locally in Lambda first. Only high-recall
      # sexual-content windows proceed to Terra, then qualifying scenes to Sol.
      # Use the semantic analysis path so every event receives a contextual,
      # non-explicit description like the established app screenshots. Sexual
      # candidates still pass through Terra and then Sol; mild/intense/death
      # violence remains excluded by the scanner policy.
      AudioChoice__OpenAI__LambdaFirstPassEnabled: "false"
      AudioChoice__OpenAI__MaximumSceneVerificationRequestsPerJob: "300"
      AudioChoice__OpenAI__MaximumSceneEscalationRequestsPerJob: "300"
      # Apply new schema migrations (including chunk progress/title backfill)
      # before the scanner begins claiming jobs.
      AudioChoice__Database__ApplyMigrations: "true"
